<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>페이지를 찾을 수 없습니다 - 다산바른통의원</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f5f7fa;color:#1d2330;text-align:center;padding:20px}
h1{font-size:22px;margin:0 0 10px}p{color:#6b7280;margin:0 0 22px}
a{display:inline-block;background:#1f3a68;color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px}
</style></head><body><div>
<h1>페이지를 찾을 수 없습니다</h1>
<p>주소가 바뀌었거나 삭제된 페이지입니다.</p>
<a id="home" href="/">홈으로 이동</a>
</div>
<script>
/* GitHub Pages 프로젝트 사이트(username.github.io/저장소명/) 에서도 홈으로 갈 수 있도록 보정 */
(function(){
  var base = '/';
  if (/\.github\.io$/i.test(location.hostname)) {
    var seg = location.pathname.split('/')[1];
    if (seg) base = '/' + seg + '/';
  }
  document.getElementById('home').setAttribute('href', base);
})();
</script>
</body></html>
