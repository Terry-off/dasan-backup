# GitHub Pages 배포
#  - actions/configure-pages 가 Pages 가 꺼져 있으면 자동으로 켜준다 (enablement: true)
#  - 저장소 전체를 정적 사이트로 배포한다 (.git, .github 는 자동 제외)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pages 설정 (꺼져 있으면 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 사이트 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
